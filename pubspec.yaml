name: niit
description: "A new Flutter project."

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0' 

dependencies:
  flutter:
    sdk: flutter

  camera: ^0.10.5+9
  google_mlkit_text_recognition: ^0.8.0
  path_provider: ^2.1.1
  path: ^1.8.3
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.0
  permission_handler: ^12.0.1
  flutter_native_splash: ^2.4.6 
  persistent_bottom_nav_bar: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  # flutter_launcher_icons: ^0.13.1

# flutter_launcher_icons:
#   android: "launcher_icon"
#   ios: true
#   image_path: "assets/img/police_logo.png"

flutter_native_splash:
  color: "#ffffff"
  image: assets/img/police_logo.png

flutter:
  uses-material-design: true

  assets:
    - assets/img/police_logo.png # Specific asset path is better